format = """
$directory$git_branch$nodejs$python
$character
"""

# Show full path for directory
[directory]
truncate_to_repo = false 
truncation_length = 0 
truncation_symbol = ""

# Show git branch only
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "

# node version
[nodejs]
format = "[$symbol($version )]($style)"
symbol = "⬢ node "
style = "green"

# python version
[python]
format = "[$symbol($version )]($style)"
symbol = "🐍 python "
style = "yellow"
